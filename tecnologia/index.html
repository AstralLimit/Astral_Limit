<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iridio Tech | Innovación Futura</title>
    <style>
        :root {
            --fondo-cyber: #050508;
            --texto-brillante: #ffffff;
            --neon-cyan: #00f2fe;
            --neon-purple: #4facfe;
            --gris-platino: #12121a;
        }
        body {
            background-color: var(--fondo-cyber);
            color: var(--texto-brillante);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #0f0c20 0%, #050508 100%);
        }
        .contenedor-placeholder {
            text-align: center;
            background-color: var(--gris-platino);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(79, 172, 254, 0.1);
            max-width: 480px;
            position: relative;
        }
        .contenedor-placeholder::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-cyan));
            border-radius: 20px 20px 0 0;
        }
        h1 {
            font-size: 2.6rem;
            margin: 0 0 15px 0;
            letter-spacing: 5px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a3a3b5 100%);
            -webkit-background-clip: text;
            background-clip: text; /* AQUI ESTÁ LA SOLUCIÓN A LA ADVERTENCIA */
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.05rem;
            color: #b3b3c6;
            margin: 0 0 25px 0;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }
        .estado-aviso {
            font-family: monospace;
            color: var(--neon-cyan);
            font-size: 0.9rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.4);
        }
        .btn-volver {
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            color: #050508;
            padding: 15px 32px;
            text-decoration: none;
            font-weight: 700;
            border-radius: 30px;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255,255,255,0.1);
            display: inline-block;
        }
        .btn-volver:hover {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="contenedor-placeholder">
        <h1>IRIDIO TECH</h1>
        <p>Dispositivos de vanguardia, automatizaciones inteligentes y soluciones de software que definen el mañana.</p>
        <div class="estado-aviso">&lt; PROTOCOLO_EN_DESARROLLO &gt;</div>
        <a href="../index.html" class="btn-volver">← VOLVER AL MENÚ CENTRAL</a>
    </div>

</body>
</html>
